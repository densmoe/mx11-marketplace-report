  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    function setProgress(pct, label) {
      const bar = document.getElementById('loading-bar');
      const txt = document.getElementById('loading-text');
      if (bar) bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
      if (txt && label) txt.textContent = label;
    }

    // Fetch the gzipped .db over HTTP and inflate it in the browser. SQLite
    // pages compress ~8x, so this downloads ~8 MB instead of ~64 MB. We fetch
    // the .gz explicitly (not via transparent Content-Encoding) so content-length
    // reflects the bytes actually on the wire and the progress bar stays honest.
    // DecompressionStream is native in all current browsers — no library needed.
    async function fetchDbWithProgress() {
      const resp = await fetch('analysis.db.gz');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const total = Number(resp.headers.get('content-length')) || 0;
      if (!resp.body) {
        setProgress(90, 'Loading data...');
        const buf = await resp.arrayBuffer();
        return await gunzip(new Uint8Array(buf));
      }
      const reader = resp.body.getReader();
      const chunks = [];
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        const mb = (received / 1048576).toFixed(1);
        // total is the compressed size; report progress against it. Cap at 85%;
        // the remaining slice covers inflation + DB parsing.
        if (total) {
          const totalMb = (total / 1048576).toFixed(1);
          setProgress((received / total) * 85, `Loading data… ${mb} / ${totalMb} MB`);
        } else {
          setProgress(50, `Loading data… ${mb} MB`);
        }
      }
      const compressed = new Uint8Array(received);
      let offset = 0;
      for (const c of chunks) { compressed.set(c, offset); offset += c.length; }
      setProgress(88, 'Decompressing…');
      return await gunzip(compressed);
    }

    // Inflate a gzip byte array using the native DecompressionStream.
    async function gunzip(compressed) {
      const ds = new DecompressionStream('gzip');
      const stream = new Response(compressed).body.pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    // file:// fallback: fetch can't read local files, so decode the base64
    // embed (loaded lazily to avoid a 81 MB parse when it isn't needed).
    async function loadEmbeddedDb() {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'db-embedded.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('embedded DB unavailable'));
        document.head.appendChild(s);
      });
      const bin = atob(window.EMBEDDED_DB);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function initDatabase() {
      try {
        const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
        let bytes;
        if (location.protocol === 'file:') {
          setProgress(50, 'Loading data...');
          bytes = await loadEmbeddedDb();
        } else {
          try {
            bytes = await fetchDbWithProgress();
          } catch (e) {
            console.warn('Streaming .db failed, falling back to embed:', e);
            bytes = await loadEmbeddedDb();
          }
        }
        setProgress(95, 'Parsing database…');
        db = new SQL.Database(bytes);
        if (window.DatabaseLayer) dbLayer = new window.DatabaseLayer(db);
        setProgress(100, 'Ready');
        if (typeof initApp === 'function') initApp();
      } catch (err) {
        console.error('DB load failed:', err);
        if (typeof showError === 'function') showError('Failed to load compatibility data.');
      }
    }
    initDatabase();
  </script>
